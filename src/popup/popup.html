<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="row">
    <select id="source"></select>
    <span class="arrow">→</span>
    <select id="target"></select>
  </div>
  <div class="row">
    <label>Provider</label>
    <select id="provider"></select>
  </div>
  <button id="translate" class="primary">Translate</button>
  <div class="row modes">
    <button data-mode="bilingual">Bilingual</button>
    <button data-mode="original">Original</button>
    <button data-mode="translation">Translation</button>
  </div>
  <a id="open-settings" href="#">Settings</a>
  <script type="module" src="popup.js"></script>
</body>
</html>
