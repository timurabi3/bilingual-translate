<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Bilingual Translate — read any page in two languages at once">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04141a"/>
      <stop offset="0.55" stop-color="#062a2e"/>
      <stop offset="1" stop-color="#04202a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a3e635"/>
      <animate attributeName="x1" values="0;1;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font: 800 74px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill:#f0fdfa; }
      .tag   { font: 500 25px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill:#99f6e4; }
      .orig  { font: 500 26px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill:#e2e8f0; }
      .trans { font: 500 26px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill:#5eead4; }
      .chip  { font: 700 16px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill:#04202a; }
      .rise  { opacity:0; transform:translateY(12px); animation:rise .7s ease-out forwards; }
      .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}
      @keyframes rise{to{opacity:1;transform:translateY(0)}}
      .flow { opacity:0; animation: flow 4s ease-in-out infinite; }
      @keyframes flow { 0%,15%{opacity:0;transform:translateY(-6px)} 35%,80%{opacity:1;transform:translateY(0)} 100%{opacity:0} }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="980" cy="90" r="320" fill="url(#glow)">
    <animate attributeName="cy" values="90;240;90" dur="12s" repeatCount="indefinite"/>
  </circle>
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>

  <g class="rise d1"><text x="72" y="126" class="title">Bilingual Translate</text></g>
  <g class="rise d2"><text x="76" y="168" class="tag">Read any page in two languages — at once.</text></g>

  <!-- original + translated line demo -->
  <g transform="translate(76,214)">
    <text class="orig">The quick brown fox jumps.</text>
    <g class="flow"><text y="40" class="trans">Der flinke braune Fuchs springt.</text></g>
    <rect x="0" y="52" width="332" height="2" rx="1" fill="url(#accent)"/>
  </g>

  <!-- chips -->
  <g class="rise d3" transform="translate(720,232)">
    <g><rect width="150" height="34" rx="17" fill="url(#accent)"/><text x="75" y="23" text-anchor="middle" class="chip">no account</text></g>
    <g transform="translate(164,0)"><rect width="132" height="34" rx="17" fill="#5eead4"/><text x="66" y="23" text-anchor="middle" class="chip">no Pro tier</text></g>
    <g transform="translate(310,0)"><rect width="150" height="34" rx="17" fill="#bef264"/><text x="75" y="23" text-anchor="middle" class="chip">bring your key</text></g>
  </g>

  <!-- shortcut key -->
  <g transform="translate(1000,60)" class="rise d2">
    <rect width="118" height="52" rx="10" fill="#0b3b40" stroke="#2dd4bf" stroke-width="2"/>
    <text x="59" y="34" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="24" fill="#5eead4">⌥ A</text>
  </g>
</svg>
